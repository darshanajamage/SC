<!DOCTYPE html>
<html>
<head>
<title>Decision Making in JS</title>
</head>
<body>
<h2>Decision</h2>
<script>
	if(10>5){
	console.log("Yes")
	}
	let x=3
	if (x>5){
	console.log("Big")
	}
	else{
	console.log("Small")
	}
	
	let m=75
	if (m>=90){
	console.log("A")
	}
	else if(m>=75){
	console.log("B")
	}
	else if(m>=50){
	console.log("C")
	}
	else{
	console.log("F")
	}
	
	let day=2
	switch(day){
	case 1:
	console.log("Mon")
	break
	case 2:
	console.log("Tue")
	break
	case 3:
	console.log("Wed")
	break
	default:
	console.log("other")
	}
</script>
</body>
</html>
