<!DOCTYPE html>
<html>
<head>
  <title>Rectangle Area</title>
</head>
<body>

<script>
class Rectangle {
  constructor(length, breadth) {
    this.length = length;
    this.breadth = breadth;
  }

  area() {
    return this.length * this.breadth;
  }
}

let A = new Rectangle(5, 4);  
document.write("Area of rectangle: " + A.area());
</script>

</body>
</html>
